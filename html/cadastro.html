<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/script.js"></script>
    <title>Cadastro - Projeto ONG</title>
</head>

<body>
    <header>
        <h1>Cadastro - Projeto ONG</h1>

        <nav>
            <button type="button" class="menu-icon" aria-label="Abrir menu" aria-expanded="false">
                ☰
            </button>

            <div class="menu">
                <a href="#" id="link-inicio">Início</a>

                <div class="dropdown">
                    <button type="button" class="dropdown-titulo" aria-expanded="false">
                        Projetos
                    </button>

                    <div class="submenu">
                        <a href="#" id="link-projetos">Projetos sociais</a>
                        <a href="#" id="link-campanhas">Campanhas</a><button type="button" class="dropdown-titulo"
                            aria-expanded="false">
                            Projetos
                        </button>
                        <a href="#" id="link-voluntariado">Voluntariado</a>
                    </div>
                </div>

                <a href="#" id="link-cadastro">Cadastro</a>
            </div>
        </nav>
    </header>
    <main>

        <h2>Cadastre-se</h2>

        <p>
            Preencha o formulário abaixo para participar das ações e iniciativas
            da nossa ONG.
        </p>

        <form action="#" method="post" id="form-cadastro">
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="000.000.000-00" required>

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </fieldset>
            <fieldset>
                <legend>Dados de contato</legend>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(00) 00000-0000" required>

            </fieldset>
            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <br><br>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>

            </fieldset>
            <button type="submit">Enviar cadastro</button>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 Projeto ONG. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
